  <text class="node-sub" x="925" y="1605">通过 / 修改</text>

  <polygon points="1395,1515 1555,1580 1395,1645 1235,1580" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text class="node-text" x="1395" y="1575">是否生成视频</text>
  <text class="node-sub" x="1395" y="1605">可选</text>

  <path class="arrow" d="M1395 1420 V1470 C1395 1500 925 1500 925 1515"/>
  <path class="arrow-soft" d="M765 1580 C650 1580 650 1370 760 1370"/>
  <text class="label" x="650" y="1490">修改图片</text>
  <path class="arrow" d="M1085 1580 H1235"/>

  <rect class="node asset" x="760" y="1760" width="330" height="100"/>
  <text class="node-text" x="925" y="1800">创建视频任务</text>
  <text class="node-sub" x="925" y="1832">Video Asset requested</text>

  <polygon points="1395,1745 1555,1810 1395,1875 1235,1810" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text class="node-text" x="1395" y="1805">审核视频</text>
  <text class="node-sub" x="1395" y="1835">通过 / 修改</text>

  <path class="arrow" d="M1395 1645 C1395 1700 925 1700 925 1760"/>
  <text class="label" x="1180" y="1700">是</text>
  <path class="arrow" d="M1090 1810 H1235"/>
  <path class="arrow-soft" d="M1235 1810 C1140 1810 1140 1810 1090 1810"/>

  <rect class="node publish" x="760" y="1990" width="330" height="100"/>
  <text class="node-text" x="925" y="2030">创建发布任务</text>
  <text class="node-sub" x="925" y="2062">Publish Job</text>

  <rect class="node publish" x="1230" y="1990" width="330" height="100"/>
  <text class="node-text" x="1395" y="2030">发布 / 投放</text>
  <text class="node-sub" x="1395" y="2062">Pages API 或 Marketing API</text>

  <path class="arrow" d="M1395 1875 C1395 1940 925 1940 925 1990"/>
  <path class="arrow" d="M1395 1645 V1940 C1395 1965 925 1965 925 1990"/>
  <text class="label" x="1460" y="1695">否</text>
  <path class="arrow" d="M1090 2040 H1230"/>

  <rect class="node data" x="155" y="1970" width="390" height="120"/>
  <text class="node-text" x="350" y="2010">数据回流</text>
  <text class="node-sub" x="350" y="2042">Post ID / Ad ID / CTR / CPC / 转化</text>
  <text class="node-sub" x="350" y="2074">进入下一轮内容优化</text>

  <path class="arrow" d="M1230 2040 H545"/>
  <path class="arrow-soft" d="M350 1970 C350 880 760 880 760 900"/>

  <rect class="note" x="118" y="2125" width="1565" height="50"/>
  <text class="note-text" x="155" y="2157">当前实现：视频生成为预留任务；Facebook 发布为 dry-run；落地页抓取、工单解析、选题/文案上下文注入已接入后端。</text>
</svg>
