name: advertising-automation

services:
  db:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ad_automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ad_automation}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ad_automation}
      LOCAL_STORAGE_ROOT: /data/storage
      GENERATION_TASK_EXECUTION_BACKEND: ${GENERATION_TASK_EXECUTION_BACKEND:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec gunicorn backend.app.main:app -k uvicorn.workers.UvicornWorker -w ${BACKEND_WORKERS:-4} -b 0.0.0.0:8001",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health/live', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  worker_text:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ad_automation}
      LOCAL_STORAGE_ROOT: /data/storage
      GENERATION_TASK_EXECUTION_BACKEND: ${GENERATION_TASK_EXECUTION_BACKEND:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend.app.worker.celery_app:celery_app worker
      --loglevel=INFO
      --queues=text_queue
      --concurrency=${TEXT_QUEUE_CONCURRENCY:-8}
      --hostname=text@%h
    deploy:
      replicas: ${WORKER_TEXT_REPLICAS:-2}

  worker_beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ad_automation}
      LOCAL_STORAGE_ROOT: /data/storage
      GENERATION_TASK_EXECUTION_BACKEND: ${GENERATION_TASK_EXECUTION_BACKEND:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend.app.worker.celery_app:celery_app beat
      --loglevel=INFO

  worker_image:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ad_automation}
      LOCAL_STORAGE_ROOT: /data/storage
      GENERATION_TASK_EXECUTION_BACKEND: ${GENERATION_TASK_EXECUTION_BACKEND:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend.app.worker.celery_app:celery_app worker
      --loglevel=INFO
      --queues=image_queue
      --concurrency=${IMAGE_QUEUE_CONCURRENCY:-4}
      --hostname=image@%h

  worker_video:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ad_automation}
      LOCAL_STORAGE_ROOT: /data/storage
      GENERATION_TASK_EXECUTION_BACKEND: ${GENERATION_TASK_EXECUTION_BACKEND:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend.app.worker.celery_app:celery_app worker
      --loglevel=INFO
      --queues=video_queue
      --concurrency=${VIDEO_QUEUE_CONCURRENCY:-4}
      --hostname=video@%h

  worker_callback:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ad_automation}
      LOCAL_STORAGE_ROOT: /data/storage
      GENERATION_TASK_EXECUTION_BACKEND: ${GENERATION_TASK_EXECUTION_BACKEND:-celery}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/data/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend.app.worker.celery_app:celery_app worker
      --loglevel=INFO
      --queues=callback_queue
      --concurrency=${CALLBACK_QUEUE_CONCURRENCY:-3}
      --hostname=callback@%h

  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
  redis_data:
